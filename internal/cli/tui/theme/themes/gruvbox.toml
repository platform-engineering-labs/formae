  selection = "#d65d0e"
  primary_accent = "#7daea3"
  secondary_accent = "#d3869b"
  error = "#ea6962"
  error_subtle = "#ea6962"
  error_bright = "#ea6962"
  warning = "#d8a657"
  unmanaged = "#ea6962"
  done = "#a9b665"
  in_progress = "#3c3836"
  pending = "#3c3836"
  op_create = "#a9b665"
  op_update = "#d8a657"
  op_delete = "#ea6962"
  op_replace = "#d3869b"
  op_detach = "#3c3836"
  op_keep = "#3c3836"
