name: mutation-test-pr

on:
  pull_request:
    branches: [main]

jobs:
  # Contract: green means gremlins completed on every changed package —
  # surviving mutants are allowed, since the content of the result is
  # advisory. Red means at least one changed package produced no usable
  # result. This check is advisory because it is not a required status
  # check, not because of a `continue-on-error` flag: job-level
  # `continue-on-error` only suppresses the workflow-run conclusion, not
  # the check run itself, so it would have bought a green run over a red
  # job rather than making the failure advisory.
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.2'

      - name: Install Pkl
        run: |
          bash -c "$(curl -fsSL https://hub.platform.engineering/get/setup.sh)" -- install --yes pkl@0.31.0

      - name: Add PEL to PATH
        run: echo "/opt/pel/bin" >> $GITHUB_PATH

      - name: Install gremlins
        run: make install-gremlins

      # The PKL schema project reads its package version from this file, so a
      # package that evaluates the schema cannot be mutated without it. This
      # job needs the stamp and not the binary, so it stamps rather than builds.
      - name: Stamp the version
        run: make version-semver

      - name: Run mutation tests on changed packages
        run: ./scripts/mutation-test-changed.sh
